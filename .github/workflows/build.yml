name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore .\CodexLanguageFix.sln
      - run: dotnet test .\CodexLanguageFix.sln --no-restore --configuration Release
      - run: >-
          dotnet publish .\src\CodexLanguageFix\CodexLanguageFix.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --no-restore
